<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tarantula · The Intelligence Community</title>
<meta name="description" content="A beat in 7/4 by The Intelligence Community. Exclusive available.">
<meta property="og:title" content="Tarantula: a beat in 7/4">
<meta property="og:description" content="The Intelligence Community. Counted 3+4. Exclusive available.">
<meta property="og:image" content="https://theintelligencecommunity.art/cover.jpg">
<meta property="og:type" content="music.song">
<meta property="og:url" content="https://theintelligencecommunity.art/74/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../cover.jpg">
<style>
  /* Same palette as the home page: Palette Forge · seed "fog" · lock accent #BF7DC4 */
  :root {
    --background: #100f11;
    --surface: #1c1b1e;
    --text: #f5f2f9;
    --muted: #a9a0b4;
    --border: #332f39;
    --accent: #bf7dc4;
    --accent-2: #c0b0ff;
    --accent-hover: #cf8cd4;
    --focus-ring: #dea8e2;
    --card-hover: #242226;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(110% 70% at 50% -5%, #1c1b1e 0%, var(--background) 55%, #0a090b 100%);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 22px 56px;
  }
  main { width: 100%; max-width: 460px; }
  header { text-align: center; }
  .cover {
    width: 120px;
    height: 120px;
    border-radius: 8px;
    object-fit: cover;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.65), 0 0 0 1px var(--border);
    margin: 4px auto 22px;
    display: block;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin: 0 0 8px;
    font-weight: 600;
  }
  .byline { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .chip {
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--accent-2);
  }
  audio { width: 100%; margin-bottom: 30px; }
  h2 {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
    margin: 0 0 12px;
  }
  section { margin-bottom: 30px; }
  p, li { font-size: 13px; line-height: 1.7; }
  p { margin: 0; }
  ul { margin: 0; padding-left: 20px; }
  li + li { margin-top: 6px; }
  a.cta {
    display: block;
    text-align: center;
    padding: 15px 18px;
    border-radius: 8px;
    background: linear-gradient(180deg, rgba(191,125,196,0.16), rgba(191,125,196,0.07));
    border: 1px solid var(--accent);
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.5px;
    margin-top: 16px;
    transition: background 140ms ease, transform 140ms ease;
  }
  a.cta:hover { background: linear-gradient(180deg, rgba(191,125,196,0.24), rgba(191,125,196,0.12)); transform: translateY(-1px); }
  a.cta:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .note { color: var(--muted); font-size: 12px; text-align: center; margin-top: 10px; }
  footer {
    margin-top: 34px;
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.7;
  }
  footer a { color: var(--accent-2); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <header>
    <img class="cover" src="../cover.jpg" alt="The Intelligence Community artwork.">
    <h1>Tarantula</h1>
    <p class="byline">A beat by The Intelligence Community</p>
    <div class="chips">
      <span class="chip">7/4 (3+4)</span>
      <span class="chip">77 BPM</span>
    </div>
  </header>

  <audio controls controlsList="nodownload" preload="metadata" src="tarantula.mp3"></audio>

  <section>
    <h2>Available</h2>
    <ul>
      <li>Exclusive license.</li>
      <li>Stems, plus a click track.</li>
      <li>Credit: produced by The Intelligence Community.</li>
    </ul>
    <a class="cta" href="https://ig.me/m/theintelligencecommunity">Message me on Instagram</a>
    <p class="note">Or reply to my email.</p>
  </section>

  <footer>
    <a href="../">theintelligencecommunity.art</a><br>
    &copy; 2026 Clever Little Rodents
  </footer>
</main>
</body>
</html>
